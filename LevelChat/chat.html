<!doctype html>
<!--
  DS Business Hub - Support Chat page (3CX Live Chat wrapper)

  This hosts your 3CX Live Chat widget so it can be opened as a pop-up window
  during a Level.io remote session.

  Two ways to use it:
    1. HOST IT (recommended): upload this file to your website
       (e.g. https://dsbusinesshub.co.uk/support-chat.html), set 3CX
       "Your website" to that domain, and point $ChatUrl in
       Open-LevelTechChat.ps1 at the URL.
    2. LOCAL: Open-LevelTechChat.ps1 can also drop a copy of this page on the
       PC and open it directly (no hosting needed).

  If you regenerate the 3CX snippet, replace the <call-us ...> element and the
  <script ...> line below. The important values are:
    phonesystem-url="https://1303.3cx.cloud"  party="LiveChat595749"
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS Business Hub - Support Chat</title>
  <style>
    html, body { height: 100%; margin: 0; background: #f4f6f8;
      font-family: "Segoe UI", Arial, sans-serif; }
    .intro { padding: 18px 16px; text-align: center; color: #2b2f33; }
    .intro h1 { font-size: 16px; margin: 6px 0; }
    .intro p  { font-size: 13px; color: #6a7178; margin: 0; }
  </style>
</head>
<body>
  <div class="intro">
    <h1>DS Business Hub &mdash; Support Chat</h1>
    <p>You're connected to our support team. Type below to chat with us.</p>
  </div>

  <!-- 3CX Live Chat widget. The script below auto-opens the chat panel.
       allow-call="false" = chat only, so the auto-open lands straight in chat.
       Set allow-call="true" if you also want a click-to-call option (the
       bubble will then open a Call/Chat menu instead of chat directly). -->
  <call-us
    phonesystem-url="https://1303.3cx.cloud"
    party="LiveChat595749"
    id="wp-live-chat-by-3CX"
    minimized="false"
    animation-style="noanimation"
    allow-call="false"
    allow-video="false"
    allow-soundnotifications="true"
    enable-mute="true"
    enable-onmobile="true"
    offline-enabled="true"
    enable="true"
    authentication="none"
    operator-name="DS Business Hub Tech"
    show-operator-actual-name="true"
    aknowledge-received="true"
    gdpr-enabled="false"
    message-userinfo-format="both"
    message-dateformat="both"
    lang="browser"
    button-icon-type="default"
    greeting-visibility="none"
    greeting-offline-visibility="none"
    chat-delay="0"
    enable-direct-call="true"
    enable-ga="false"
    style="position:fixed;right:16px;bottom:16px;z-index:99999;font-size:16px;line-height:17px;"
  ></call-us>
  <script defer src="https://downloads-global.3cx.com/downloads/livechatandtalk/v1/callus.js" id="tcx-callus-js" charset="utf-8"></script>

  <!-- Auto-open the chat. Targets the real 3CX widget internals seen in the
       shadow DOM: open the launcher (.minimized-button), then click
       "Start new conversation" (.start-new) to reveal the message box.
       Stops once a visible text input exists (chat is ready to type). -->
  <script>
    (function () {
      function deep(root, out) {
        var e = root.querySelectorAll('*');
        for (var i = 0; i < e.length; i++) {
          out.push(e[i]);
          if (e[i].shadowRoot) deep(e[i].shadowRoot, out);
        }
      }
      function vis(el) {
        var r = el.getBoundingClientRect();
        if (!(r.width > 4 && r.height > 4)) return false;
        if (r.bottom <= 0 || r.right <= 0 || r.top >= window.innerHeight || r.left >= window.innerWidth) return false;
        if (el.checkVisibility) {
          try { if (!el.checkVisibility({ opacityProperty: true, visibilityProperty: true, contentVisibilityAuto: true })) return false; }
          catch (e) {}
        }
        return true;
      }
      function byClass(all, c) {
        for (var i = 0; i < all.length; i++) {
          if (all[i].classList && all[i].classList.contains(c) && vis(all[i])) return all[i];
        }
        return null;
      }
      function input(all) {
        for (var i = 0; i < all.length; i++) {
          var t = all[i].tagName;
          if ((t === 'INPUT' || t === 'TEXTAREA' || all[i].isContentEditable) && vis(all[i])) return all[i];
        }
        return null;
      }
      function fire(el) {
        var ty = ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'];
        for (var i = 0; i < ty.length; i++) {
          var ev;
          try { ev = new MouseEvent(ty[i], { bubbles: true, cancelable: true, composed: true }); }
          catch (e) { ev = document.createEvent('MouseEvents'); ev.initEvent(ty[i], true, true); }
          el.dispatchEvent(ev);
        }
      }
      var last = '', lastAt = 0, tries = 0;
      var timer = setInterval(function () {
        tries++;
        var all = [];
        deep(document, all);
        if (input(all)) { clearInterval(timer); return; }         // open & ready to type
        var now = Date.now();
        var sn = byClass(all, 'start-new');                       // "Start new conversation"
        if (sn) { if (!(last === 'sn' && now - lastAt < 1500)) { fire(sn); last = 'sn'; lastAt = now; } return; }
        var open = byClass(all, 'footer-root') || byClass(all, 'chat-root') || byClass(all, 'panel_body');
        if (open) return;                                         // panel open/transitioning - don't toggle it shut
        var bubble = byClass(all, 'minimized-button') || byClass(all, 'bubble');
        if (bubble) { if (!(last === 'b' && now - lastAt < 1500)) { fire(bubble); last = 'b'; lastAt = now; } }
        if (tries > 80) clearInterval(timer);
      }, 400);
    })();
  </script>
</body>
</html>
